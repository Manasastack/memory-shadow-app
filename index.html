
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Shadow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-deep: #020617;
        --bg-navy: #1e1b4b;
        --accent-plum: #4c1d95;
      }
      body {
        background-color: var(--bg-deep);
        /* Premium Cosmic Background */
        background-image: 
          radial-gradient(circle at 0% 0%, rgba(30, 27, 75, 0.4), transparent 50%),
          radial-gradient(circle at 100% 0%, rgba(76, 29, 149, 0.2), transparent 40%),
          radial-gradient(circle at 50% 100%, rgba(15, 23, 42, 1), transparent 60%),
          linear-gradient(180deg, #020617 0%, #0f172a 100%);
        background-attachment: fixed;
        color: #f8fafc;
        font-family: 'Outfit', sans-serif;
        height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Film Grain Texture */
      .grain-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 1;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* --- Depth System --- */

      /* Layer 1: Base Panels */
      .glass-layer-1 {
        background: rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      }

      /* Layer 2: Interactive Areas */
      .glass-layer-2 {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 
          0 20px 40px -10px rgba(0, 0, 0, 0.4),
          inset 0 0 0 1px rgba(255, 255, 255, 0.02);
      }

      /* Layer 3: Floating Elements */
      .glass-layer-3 {
        background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      }

      /* --- Animation Library --- */

      /* 1. Shimmer (Solid Items) */
      @keyframes shine-lines {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      .hover-shimmer {
        position: relative;
        overflow: hidden;
      }
      .hover-shimmer::before {
        content: '';
        position: absolute;
        top: 0; left: -100%; width: 50%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        transform: skewX(-20deg);
        transition: left 0.5s;
      }
      .hover-shimmer:hover::before {
        left: 200%;
        transition: left 1s ease-in-out;
      }

      /* 2. Wobble (Drifting Items) */
      @keyframes soft-wobble {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-2px) rotate(-1deg); }
        75% { transform: translateX(2px) rotate(1deg); }
      }
      .hover-wobble:hover {
        animation: soft-wobble 0.6s ease-in-out;
      }

      /* 3. Pulse Red (Fading Items) */
      @keyframes pulse-red-border {
        0% { border-color: transparent; box-shadow: 0 0 0 transparent; }
        50% { border-color: rgba(244, 63, 94, 0.3); box-shadow: 0 0 15px rgba(244, 63, 94, 0.15); }
        100% { border-color: transparent; box-shadow: 0 0 0 transparent; }
      }
      .hover-pulse-red:hover {
        animation: pulse-red-border 2s infinite;
      }

      /* 4. Breathe (Online Status) */
      @keyframes breathe-dot {
        0% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.6); opacity: 0; }
        100% { transform: scale(1); opacity: 0; }
      }
      .animate-breathe {
        animation: breathe-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* 5. Orbit (Planet Ring) */
      @keyframes orbit-spin {
        from { transform: rotate(0deg) scale(1); }
        to { transform: rotate(360deg) scale(1); }
      }
      .animate-orbit {
        animation: orbit-spin 12s linear infinite;
      }

      /* Floating Particles */
      @keyframes float-particle {
        0% { transform: translateY(0) translateX(0); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        background: white;
        pointer-events: none;
        opacity: 0;
      }

      /* Utilities */
      .text-glow { text-shadow: 0 0 15px currentColor; }
      .clip-clean { clip-path: inset(0 0 0 0 round 1.5rem); }
      
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }
      
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>
</head>
  <body>
    <!-- Grain Texture for filmic look -->
    <div class="grain-overlay"></div>
    
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
